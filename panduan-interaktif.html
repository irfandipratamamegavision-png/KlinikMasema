<style>
  :root{
    --ink:#182420;
    --ink-soft:#5B6B62;
    --paper:#F7F4EC;
    --paper-raised:#FFFFFF;
    --primary:#0E4A41;
    --primary-dark:#0A332C;
    --primary-soft:#E4EEE9;
    --gold:#B8862B;
    --gold-soft:#F6ECD6;
    --brick:#A23B33;
    --brick-soft:#F6E3E0;
    --line:#DDD6C6;
    --line-soft:#EAE4D4;
    --shadow: 0 18px 40px -18px rgba(14,74,65,0.28);
    --radius:14px;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(14,74,65,0.06), transparent),
      radial-gradient(900px 500px at -10% 110%, rgba(184,134,43,0.08), transparent),
      var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
  }

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:0; z-index:40;
    background:rgba(247,244,236,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 22px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto;}
  .brand .cross{
    width:36px; height:36px; border-radius:10px; background:#fff;
    display:flex; align-items:center; justify-content:center;
    flex:none; padding:4px; box-sizing:border-box;
    box-shadow: var(--shadow), 0 0 0 1px var(--line);
  }
  .brand .cross img{width:100%; height:100%; object-fit:contain; display:block;}
  .brand .txt{line-height:1.15;}
  .brand .txt b{font-family:var(--font-display); font-size:16.5px; font-weight:700; color:var(--primary-dark); display:block;}
  .brand .txt span{font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); letter-spacing:.02em;}

  .modules{display:flex; gap:6px; background:var(--primary-soft); padding:5px; border-radius:999px;}
  .modules button{
    border:none; background:transparent; padding:8px 16px; border-radius:999px;
    font-family:var(--font-body); font-weight:600; font-size:13.5px; color:var(--primary-dark);
    cursor:pointer; transition:.2s; white-space:nowrap;
  }
  .modules button.active{background:var(--primary); color:#fff; box-shadow:var(--shadow);}
  .modules button:not(.active):hover{background:rgba(14,74,65,0.1);}

  /* ---------- Layout ---------- */
  .layout{
    display:grid; grid-template-columns:250px 1fr; gap:26px;
    max-width:1180px; margin:0 auto; padding:26px 22px 70px;
    align-items:start;
  }
  @media (max-width:900px){
    .layout{grid-template-columns:1fr; padding:16px 14px 50px;}
  }

  /* ---------- Sidebar ---------- */
  aside.steps{
    position:sticky; top:78px;
    display:flex; flex-direction:column; gap:3px;
    max-height:calc(100vh - 100px); overflow-y:auto; padding-right:4px;
  }
  @media (max-width:900px){
    aside.steps{
      position:static; flex-direction:row; overflow-x:auto; overflow-y:visible;
      max-height:none; padding-bottom:6px; gap:8px;
      scrollbar-width:thin;
    }
  }
  .step-nav{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:10px; cursor:pointer;
    border:1px solid transparent; text-align:left;
    background:transparent; font-family:var(--font-body);
    transition:.15s;
  }
  .step-nav:hover{background:var(--primary-soft);}
  .step-nav.active{background:var(--paper-raised); border-color:var(--line); box-shadow:var(--shadow);}
  @media (max-width:900px){
    .step-nav{flex:none; min-width:190px;}
  }
  .step-nav .tag{
    font-family:var(--font-mono); font-size:10.5px; font-weight:700;
    color:var(--gold); background:var(--gold-soft); border:1px solid #e8d5a6;
    padding:2px 6px; border-radius:5px; flex:none;
  }
  .step-nav.active .tag{background:var(--primary); color:#fff; border-color:var(--primary);}
  .step-nav .lbl{font-size:12.8px; font-weight:600; color:var(--ink); line-height:1.25;}
  .step-nav.active .lbl{color:var(--primary-dark);}

  /* ---------- Stage ---------- */
  main.stage{display:flex; flex-direction:column; gap:20px;}

  .frame-wrap{position:relative;}
  .frame{
    background:var(--paper-raised); border-radius:18px; overflow:hidden;
    border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .frame-chrome{
    display:flex; align-items:center; gap:6px; padding:9px 14px;
    background:#EFEAE0; border-bottom:1px solid var(--line);
  }
  .frame-chrome i{width:9px; height:9px; border-radius:50%; background:#D8CFB8; display:block;}
  .frame-chrome .url{
    margin-left:8px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft);
    background:#fff; padding:3px 10px; border-radius:6px; border:1px solid var(--line-soft);
  }

  .app-header{
    background:linear-gradient(135deg, var(--primary), var(--primary-dark));
    color:#fff; padding:12px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .app-header .app-brand{display:flex; align-items:center; gap:8px; margin-right:auto;}
  .app-header .app-brand .ic{width:24px; height:24px; border-radius:6px; background:#fff; display:flex; align-items:center; justify-content:center; padding:2px; box-sizing:border-box;}
  .app-header .app-brand .ic img{width:100%; height:100%; object-fit:contain; display:block;}
  .app-header .app-brand b{font-size:13px; display:block; font-family:var(--font-display);}
  .app-header .app-brand small{font-size:9.5px; opacity:.75;}
  .pill{font-size:10.5px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.15); font-weight:600;}
  .pill.online{background:rgba(255,255,255,.2);}
  .pill.online:before{content:"● "; color:#8CE0B0;}

  .app-tabbar{display:flex; gap:5px; padding:9px 14px; background:#fff; border-bottom:1px solid var(--line-soft); flex-wrap:wrap;}
  .app-tab{
    font-size:11px; font-weight:600; padding:6px 11px; border-radius:8px; color:var(--ink-soft);
    background:transparent; font-family:var(--font-body);
  }
  .app-tab.active{background:var(--primary); color:#fff;}

  .app-body{padding:18px; min-height:270px; background:#FCFBF7; position:relative;}

  /* generic mock components */
  .mock-banner{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; border-radius:9px; font-size:11.5px; font-weight:600; margin-bottom:12px; flex-wrap:wrap;}
  .mock-banner.warn{background:#FFF3DE; color:#8A5A00; border:1px solid #F0D9A0;}
  .mock-banner.danger{background:var(--brick-soft); color:var(--brick); border:1px solid #E7BEB8;}
  .mock-banner.info{background:var(--primary-soft); color:var(--primary-dark); border:1px solid #cfe3da;}
  .mock-banner .lnk{text-decoration:underline; font-weight:700; white-space:nowrap;}

  .mock-card{background:#fff; border:1px solid var(--line-soft); border-radius:11px; padding:13px 15px; margin-bottom:12px;}
  .mock-card h4{margin:0 0 6px; font-size:12.5px; font-family:var(--font-body); color:var(--primary-dark);}
  .mock-card p.sub{margin:0 0 10px; font-size:10.5px; color:var(--ink-soft);}

  .mock-row{display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line-soft); font-size:11px;}
  .mock-row:last-child{border-bottom:none;}
  .mock-row .c1{flex:2; font-weight:600;}
  .mock-row .c2{flex:1; color:var(--ink-soft);}
  .mock-row .c3{flex:1; text-align:right; font-family:var(--font-mono); font-weight:700;}

  .mock-input{background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 11px; font-size:11px; color:var(--ink-soft); margin-bottom:8px;}
  .mock-field label{display:block; font-size:9.5px; font-weight:700; color:var(--ink-soft); margin-bottom:3px; text-transform:uppercase; letter-spacing:.03em;}

  .mock-btn{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:7px 13px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); font-family:var(--font-body);}
  .mock-btn.primary{background:var(--primary); color:#fff; border-color:var(--primary);}
  .mock-btn.danger{background:#fff; color:var(--brick); border-color:#e7beb8;}
  .mock-btn.ghost{background:var(--primary-soft); color:var(--primary-dark); border-color:transparent;}
  .mock-btn.gold{background:var(--gold-soft); color:#7a5915; border-color:#e8d5a6;}

  .mock-badge{font-size:9px; font-weight:700; padding:2px 7px; border-radius:6px;}
  .mock-badge.low{background:var(--brick-soft); color:var(--brick);}
  .mock-badge.ok{background:var(--primary-soft); color:var(--primary-dark);}
  .mock-badge.soon{background:#FFF3DE; color:#8A5A00;}

  .mock-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .mock-stat{background:#fff; border:1px solid var(--line-soft); border-radius:10px; padding:11px 13px;}
  .mock-stat .n{font-family:var(--font-display); font-size:19px; color:var(--primary-dark); font-weight:600;}
  .mock-stat .l{font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}

  .mock-bars{display:flex; align-items:flex-end; gap:8px; height:80px; margin:6px 0 4px;}
  .mock-bars i{flex:1; background:linear-gradient(180deg, var(--primary), var(--primary-soft)); border-radius:5px 5px 0 0; display:block;}

  .mock-modal-overlay{position:absolute; inset:0; background:rgba(14,20,17,0.32); display:flex; align-items:center; justify-content:center; padding:20px; border-radius:0 0 18px 18px;}
  .mock-modal{background:#fff; border-radius:12px; padding:16px 18px; width:100%; max-width:330px; box-shadow:0 22px 45px -14px rgba(0,0,0,.35);}
  .mock-modal h5{margin:0 0 10px; font-size:12.5px; font-family:var(--font-display); color:var(--primary-dark);}
  .kv{display:flex; justify-content:space-between; font-size:10.8px; padding:5px 0; border-bottom:1px dashed var(--line-soft);}
  .kv b{font-weight:700;}

  .mock-tag-tabs{display:flex; gap:6px; margin-bottom:12px;}
  .mock-tag-tabs span{font-size:10.5px; font-weight:700; padding:6px 12px; border-radius:8px; background:var(--primary-soft); color:var(--primary-dark);}
  .mock-tag-tabs span.active{background:var(--primary); color:#fff;}

  /* spotlight highlight */
  .spot{position:relative; outline:2.5px solid var(--gold); outline-offset:2px; border-radius:8px; animation:pulseSpot 1.6s ease-in-out infinite;}
  @keyframes pulseSpot{
    0%,100%{box-shadow:0 0 0 0 rgba(184,134,43,0.45);}
    50%{box-shadow:0 0 0 7px rgba(184,134,43,0);}
  }
  .callout{
    position:absolute; z-index:20; max-width:210px; background:var(--ink); color:#fff;
    font-size:11px; line-height:1.4; padding:9px 12px; border-radius:9px;
    font-family:var(--font-body); font-weight:500; box-shadow:0 12px 26px -8px rgba(0,0,0,.4);
    display:none;
  }
  .callout:after{content:""; position:absolute; top:-6px; left:18px; width:12px; height:12px; background:var(--ink); transform:rotate(45deg);}
  .callout b{color:var(--gold); font-family:var(--font-mono); display:block; font-size:9.5px; letter-spacing:.03em; margin-bottom:2px;}

  /* ---------- Caption panel ---------- */
  .caption{background:var(--paper-raised); border:1px solid var(--line); border-radius:16px; padding:22px 26px; box-shadow:var(--shadow);}
  .caption-head{display:flex; align-items:flex-start; gap:14px; margin-bottom:12px;}
  .rx-label{
    flex:none; position:relative; background:var(--gold-soft); border:1px solid #e8d5a6;
    border-radius:8px; padding:7px 12px 6px; transform:rotate(-3deg); font-family:var(--font-mono);
    font-size:10.5px; font-weight:700; color:#7a5915; letter-spacing:.02em;
  }
  .rx-label:before{
    content:""; position:absolute; top:-6px; left:12px; width:26px; height:11px;
    background:rgba(255,255,255,.75); border:1px solid rgba(0,0,0,.06); transform:rotate(-6deg);
  }
  .caption-head h2{margin:0; font-family:var(--font-display); font-size:23px; font-weight:600; color:var(--primary-dark); line-height:1.2;}
  .caption-head .module-lbl{font-size:11px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin:2px 0 0;}

  .caption p.desc{font-size:14px; line-height:1.65; color:var(--ink); margin:0 0 14px;}
  .caption ul.bullets{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px;}
  .caption ul.bullets li{display:flex; gap:9px; font-size:13.2px; line-height:1.5; color:var(--ink);}
  .caption ul.bullets li:before{content:"✓"; color:var(--primary); font-weight:700; flex:none; margin-top:1px;}

  /* ---------- Footer nav ---------- */
  .nav-bottom{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .dots{display:flex; gap:6px; flex-wrap:wrap;}
  .dots span{width:7px; height:7px; border-radius:50%; background:var(--line); cursor:pointer; transition:.2s;}
  .dots span.active{background:var(--primary); width:20px; border-radius:4px;}
  .nav-btns{display:flex; gap:9px;}
  .nav-btns button{
    font-family:var(--font-body); font-weight:700; font-size:13px; padding:10px 18px; border-radius:10px;
    cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); transition:.15s;
  }
  .nav-btns button.primary{background:var(--primary); color:#fff; border-color:var(--primary);}
  .nav-btns button.primary:hover{background:var(--primary-dark);}
  .nav-btns button:disabled{opacity:.35; cursor:not-allowed;}
  .nav-btns button:not(:disabled):not(.primary):hover{background:var(--primary-soft);}

  .progress-line{height:3px; background:var(--line-soft); border-radius:3px; overflow:hidden; margin-bottom:2px;}
  .progress-line i{display:block; height:100%; background:var(--primary); transition:width .3s;}

  footer.credit{text-align:center; padding:24px; font-size:11px; color:var(--ink-soft); font-family:var(--font-mono);}
</style>
</head>

/* ============ helper builders ============ */
function tabs(list, active){
  return list.map(t=>`<span class="app-tab ${t===active?'active':''}">${t}</span>`).join('');

function banner(icon, text, linkText, variant='warn', key){
  return `<div class="mock-banner ${variant}"><span>${icon} ${text}</span>${linkText?`<span class="lnk" ${key?`data-key="${key}"`:''}>${linkText}</span>`:''}</div>`;
}
function card(title, sub, body){

}
function row(c1,c2,c3, badge, key){

}
function btn(label, variant='', key){

function field(label, value){

function kv(label, value, bold){

}
function modal(title, body, key){
  return `<div class="mock-modal-overlay" ${key?`data-key="${key}"`:''}><div class="mock-modal"><h5>${title}</h5>${body}</div></div>`;
}

/* ============ RUNTIME ============ */
const MODULES = [
  {key:'kasir', label:'🏪 Kasir & Apotek'},
  {key:'klinik', label:'🩺 Klinik'},
  {key:'admin', label:'⚙️ Pengaturan'},
];

let currentModule = 'kasir';
let currentIndex = 0; // index within STEPS global array

function stepsOf(mod){ return STEPS.filter(s=>s.module===mod); }
function globalIndex(step){ return STEPS.indexOf(step); }

function renderModuleSwitch(){
  const el = document.getElementById('moduleSwitch');
  el.innerHTML = MODULES.map(m=>`<button data-mod="${m.key}" class="${m.key===currentModule?'active':''}">${m.label}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      currentModule = b.dataset.mod;
      const first = stepsOf(currentModule)[0];
      goTo(globalIndex(first));
    });
  });
}

function renderStepNav(){
  const el = document.getElementById('stepNav');
  const list = stepsOf(currentModule);
  el.innerHTML = list.map(s=>{
    const gi = globalIndex(s);
    return `<button class="step-nav ${gi===currentIndex?'active':''}" data-gi="${gi}">
      <span class="tag">${s.code}</span><span class="lbl">${s.title}</span>
    </button>`;
  }).join('');
  el.querySelectorAll('.step-nav').forEach(b=>{
    b.addEventListener('click', ()=> goTo(parseInt(b.dataset.gi)));
  });
}

function renderDots(){
  const el = document.getElementById('dots');
  const list = stepsOf(currentModule);
  el.innerHTML = list.map(s=>{
    const gi = globalIndex(s);
    return `<span class="${gi===currentIndex?'active':''}" data-gi="${gi}"></span>`;
  }).join('');
  el.querySelectorAll('span').forEach(d=>{
    d.addEventListener('click', ()=> goTo(parseInt(d.dataset.gi)));
  });
}

function renderProgress(){
  const list = stepsOf(currentModule);
  const posInModule = list.findIndex(s=>globalIndex(s)===currentIndex);
  const pct = ((posInModule+1)/list.length)*100;
  document.getElementById('progressBar').style.width = pct+'%';
}

function positionCallout(step){
  const bubble = document.getElementById('callout');
  const tagEl = document.getElementById('calloutTag');
  const textEl = document.getElementById('calloutText');
  const wrap = document.querySelector('.frame-wrap');
  if(!step.callout){ bubble.style.display='none'; return; }
  const target = document.querySelector(`[data-key="${step.callout.key}"]`);
  if(!target){ bubble.style.display='none'; return; }
  tagEl.textContent = step.callout.tag;
  textEl.textContent = step.callout.text;
  bubble.style.display='block';
  const wrapRect = wrap.getBoundingClientRect();
  const tRect = target.getBoundingClientRect();
  let top = tRect.bottom - wrapRect.top + 12;
  let left = tRect.left - wrapRect.left;
  const maxLeft = wrapRect.width - 220;
  if(left>maxLeft) left = maxLeft;
  if(left<8) left = 8;
  bubble.style.top = top+'px';
  bubble.style.left = left+'px';
}

function renderStage(step){
  document.getElementById('chromeUrl').textContent = 'apotekmasema.github.io/'+step.url;
  document.getElementById('roleBadge').textContent = step.role;
  document.getElementById('appTabbar').innerHTML = tabs(step.tabbar, step.activeTab);
  document.getElementById('appBody').innerHTML = step.body;

  document.querySelectorAll('[data-key]').forEach(el=>el.classList.remove('spot'));
  if(step.callout){
    const t = document.querySelector(`[data-key="${step.callout.key}"]`);
    if(t) t.classList.add('spot');
  }
}

function renderCaption(step){
  document.getElementById('rxLabel').textContent = 'No. '+step.code;
  document.getElementById('moduleLbl').textContent = MODULES.find(m=>m.key===step.module).label;
  document.getElementById('stepTitle').textContent = step.title;
  document.getElementById('stepDesc').textContent = step.desc;
  document.getElementById('stepBullets').innerHTML = step.bullets.map(b=>`<li>${b}</li>`).join('');
}

function renderNavButtons(){
  const list = stepsOf(currentModule);
  const posInModule = list.findIndex(s=>globalIndex(s)===currentIndex);
  document.getElementById('btnPrev').disabled = posInModule<=0;
  const isLast = posInModule>=list.length-1;
  const nextBtn = document.getElementById('btnNext');
  const isLastModule = MODULES[MODULES.length-1].key===currentModule;
  nextBtn.disabled = isLast && isLastModule;
  nextBtn.textContent = isLast ? (isLastModule? 'Selesai ✓' : 'Modul Berikutnya →') : 'Berikutnya →';
}

function goTo(gi){
  currentIndex = gi;
  currentModule = STEPS[gi].module;
  const step = STEPS[gi];
  renderModuleSwitch();
  renderStepNav();
  renderDots();
  renderProgress();
  renderStage(step);
  renderCaption(step);
  renderNavButtons();
  requestAnimationFrame(()=> setTimeout(()=>positionCallout(step), 60));
  document.querySelector('main.stage').scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('btnPrev').addEventListener('click', ()=>{
  const list = stepsOf(currentModule);
  const pos = list.findIndex(s=>globalIndex(s)===currentIndex);
  if(pos>0) goTo(globalIndex(list[pos-1]));
});
document.getElementById('btnNext').addEventListener('click', ()=>{
  const list = stepsOf(currentModule);
  const pos = list.findIndex(s=>globalIndex(s)===currentIndex);
  if(pos<list.length-1){ goTo(globalIndex(list[pos+1])); return; }
  const mi = MODULES.findIndex(m=>m.key===currentModule);
  if(mi<MODULES.length-1){
    const nextMod = MODULES[mi+1].key;
    goTo(globalIndex(stepsOf(nextMod)[0]));
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') document.getElementById('btnNext').click();
  if(e.key==='ArrowLeft') document.getElementById('btnPrev').click();
});
window.addEventListener('resize', ()=> positionCallout(STEPS[currentIndex]));

goTo(0);
</script>
